name: Deploy to Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Manual override for image tag/version to deploy"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vars:
    name: Set Variables
    outputs:
      tag: ${{ inputs.tag || steps.version.outputs.new_tag }}
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: write
      pull-requests: read # Needed to fetch PR info
    steps:
      - name: Checkout Code
        if: ${{ ! inputs.tag }}
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          
      - name: Get PR number
        if: ${{ ! inputs.tag }}
        id: pr
        uses: bcgov-nr/action-get-pr@v0.0.1

      - name: Bump version and push tag
        if: ${{ ! inputs.tag }}
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  retag:
    name: Tag PR Images with Version
    needs: [vars]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [analysis, backend, frontend]
    timeout-minutes: 5
    steps:
      - name: Retag Images
        # Only run this step if it's an automated merge (no manual tag) AND it found a PR number
        if: ${{ ! inputs.tag && needs.vars.outputs.pr != '' }}
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.pr }}
          tags: ${{ needs.vars.outputs.tag }}

  deploy-test:
    name: Deploy (test, tag=${{ needs.vars.outputs.tag }})
    needs: [vars, retag] # Wait for the retag job to finish
    uses: ./.github/workflows/.deployer.yml
    secrets:
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      environment: test
      tag: ${{ needs.vars.outputs.tag }}
      params: >-
        --set global.secrets.persist=false
        --set-string frontend.baseUrl=https://burn-severity-map-test-frontend.apps.silver.devops.gov.bc.ca
