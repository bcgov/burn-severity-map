name: Deploy to Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Manual override for image tag/version to deploy"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vars:
    name: Set Variables
    outputs:
      tag: ${{ inputs.tag || steps.version.outputs.new_tag }}
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: write
      pull-requests: read # Needed to fetch PR info
    steps:
      - name: Checkout Code
        if: ${{ ! inputs.tag }}
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          
      - name: Get PR number
        if: ${{ ! inputs.tag }}
        id: pr
        uses: bcgov-nr/action-get-pr@v0.0.1

      - name: Bump version and push tag
        if: ${{ ! inputs.tag }}
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  retag:
    name: Tag PR Images with Version
    needs: [vars]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [analysis, backend, frontend]
    timeout-minutes: 5
    steps:
      - name: Check if tag already exists in registry
        id: check-tag
        run: |
          # 1. Securely log into GitHub Container Registry using the built-in runner token
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 2. Use docker to ask the registry if the manifest for this exact tag exists
          if docker manifest inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${{ needs.vars.outputs.tag }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ needs.vars.outputs.tag }} already exists. Skipping retag to protect historical data."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ needs.vars.outputs.tag }} does not exist yet. Proceeding with copy."
          fi
      - name: Retag Images
        # Only run this step if it's an automated merge or a brand new manual tag that doesn't exist yet
        if: ${{ needs.vars.outputs.pr != '' || (inputs.tag != '' && steps.check-tag.outputs.exists != 'true') }}
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.pr || 'latest' }}
          tags: ${{ needs.vars.outputs.tag }}

  deploy-test:
    name: Deploy (test, tag=${{ needs.vars.outputs.tag }})
    needs: [vars, retag] # Wait for the retag job to finish
    uses: ./.github/workflows/.deployer.yml
    secrets:
      oc_token: ${{ secrets.OC_TOKEN }}
      S3_ACCESS_ID: ${{ secrets.S3_ACCESS_ID }}
      S3_KEY: ${{ secrets.S3_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    with:
      environment: test
      tag: ${{ needs.vars.outputs.tag }}
      params: >-
        --set global.secrets.persist=false
        --set-string frontend.baseUrl=https://burn-severity-map-test-frontend.apps.silver.devops.gov.bc.ca
        --set-string global.s3.endPoint=${{ vars.S3_ENDPOINT }}
        --set global.ports.backend=${{ vars.BACKEND_PORT }}
        --set global.ports.frontend=${{ vars.FRONTEND_PORT }}
        --set global.ports.analysis=${{ vars.ANALYSIS_PORT }}
        --set-string global.dirs.tmpDir=${{ vars.TEMP_DIR }}
        --set-string global.dirs.extDir=${{ vars.EXT_DIR }}
        --set-string global.dirs.mainDir=${{ vars.MAIN_DIR }}
        --set-string global.files.parquet=${{ vars.PARQUET_FILE }}
        --set-string backend.appVersion=${{ needs.vars.output.tag }}
