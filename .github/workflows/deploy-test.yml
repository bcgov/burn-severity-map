name: Deploy to Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag set to deploy (e.g. PR number)"
        type: string
        required: false

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vars:
    name: Set Variables
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # Get PR number for squash merges to main
      - name: PR Number
        if: ${{ ! inputs.tag }}
        id: pr
        uses: bcgov-nr/action-get-pr@v0.0.1

      - name: Set Tag
        id: tag
        run: echo "tag=${{ inputs.tag || steps.pr.outputs.pr }}" >> $GITHUB_OUTPUT

  # https://github.com/bcgov/quickstart-openshift-helpers
  deploy-test:
    name: Deploy (test, tag=${{ needs.vars.outputs.tag }})
    needs: [vars]
    uses: ./.github/workflows/.deployer.yml
    secrets:
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      environment: test
      tag: ${{ needs.vars.outputs.tag }}
      params: >-
        --set global.secrets.persist=false
        --set-string frontend.baseUrl=https://burn-severity-map-test-frontend.apps.silver.devops.gov.bc.ca

  