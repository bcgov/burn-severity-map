name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The verified version from Test to promote to Prod (e.g., v1.0.5)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vars:
    name: Set Variables
    outputs:
      version: ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Echo Target Tag
        run: echo "Deploying version ${{ inputs.version }} to production."

  deploy-prod:
    name: Deploy (prod, version=${{ needs.vars.outputs.version }})
    needs: [vars]
    uses: ./.github/workflows/.deployer.yml
    secrets:
      oc_token: ${{ secrets.OC_TOKEN }}
      S3_ACCESS_ID: ${{ secrets.S3_ACCESS_ID }}
      S3_KEY: ${{ secrets.S3_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    with:
      environment: prod
      params: >-
        --set global.secrets.persist=false
        --set-string frontend.baseUrl=https://burn-severity-map-prod-frontend.apps.silver.devops.gov.bc.ca
        --set-string global.s3.endPoint=${{ vars.S3_ENDPOINT }}
        --set global.ports.backend=${{ vars.BACKEND_PORT }}
        --set global.ports.frontend=${{ vars.FRONTEND_PORT }}
        --set global.ports.analysis=${{ vars.ANALYSIS_PORT }}
        --set-string global.dirs.tmpDir=${{ vars.TEMP_DIR }}
        --set-string global.dirs.extDir=${{ vars.EXT_DIR }}
        --set-string global.dirs.mainDir=${{ vars.MAIN_DIR }}
        --set-string global.files.parquet=${{ vars.PARQUET_FILE }}
        --set-string backend.appVersion=${{ needs.vars.outputs.version }}
        --set-string global.sso.clientID=${{ vars.OIDC_CLIENT_ID }}
        --set-string global.sso.authorityURL=${{ vars.OIDC_AUTHORITY_PROD }}
      tag: ${{ needs.vars.outputs.version }}

  promote:
    name: Promote Images
    needs: [deploy-prod, vars]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [analysis, backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.version }}
          tags: prod
