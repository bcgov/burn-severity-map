x-shared-env: &shared-env
  PARQUET_FILE: ${PARQUET_FILE}
  MAIN_DIR: ${MAIN_DIR}
  TEMP_DIR: ${TEMP_DIR}
  EXT_DIR: ${EXT_DIR}
  BACKEND_PORT: ${BACKEND_PORT:-8000}
  FRONTEND_PORT: ${FRONTEND_PORT:-8080}
  ANALYSIS_PORT: ${ANALYSIS_PORT:-5000}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_ACCESS_ID: ${S3_ACCESS_ID}
  S3_KEY: ${S3_KEY}
  S3_BUCKET: ${S3_BUCKET}
  NO_PROXY: ${NO_PROXY}
  AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
  AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
  APP_VERSION: 'dev-local'
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
  OIDC_AUTHORITY: ${OIDC_AUTHORITY}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/${REDIS_DATABASE:-0}

services:
  # Object Storage infrastructure
  minio:
    image: quay.io/minio/minio:latest
    container_name: local-s3
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console Port
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_ID:-local-access-key}
      - MINIO_ROOT_PASSWORD=${S3_KEY:-local-secret-key}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - s3-network
    
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: local-s3_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set localS3 http://local-s3:9000 ${S3_ACCESS_ID:-local-access-key} ${S3_KEY:-local-secret-key}) do echo '...waiting...' && sleep 1; done;
           
      echo 'Creating bucket....';
      /usr/bin/mc mb localS3/${S3_BUCKET:-burn-severity-local};
      /usr/bin/mc policy set download localS3/${S3_BUCKET:-burn-severity-local};
      
      echo 'Setup complete';
      exit 0;
      "
    networks:
      - s3-network

  frontend:
    image: burn-sev-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-bs
    depends_on:
      - fastapi-backend
    ports:
      - "8080:${FRONTEND_PORT:-8080}"
    environment:
      <<: *shared-env
    env_file:
      - .env
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks:
      - s3-network

  fastapi-backend:
    image: burn-sev-backend:latest
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: fastapi-backend
    depends_on:
      - minio
    ports:
      - "8000:${BACKEND_PORT:-8000}"
    environment:
      <<: *shared-env
    env_file:
      - .env
    volumes:
      - backend-data:/app/data
    command: uv run python -m uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload
    networks:
      - s3-network

  analysis-backend:
    image: analysis-backend:latest
    build:
      context: ./analysis
      dockerfile: Dockerfile
    container_name: analysis-backend
    depends_on:
      - minio
    ports:
      - "5000:${ANALYSIS_PORT:-5000}"
    environment:
      <<: *shared-env
    env_file:
      - .env
    volumes:
      - analysis-data:/app/data
    command: ["gunicorn", "--timeout", "1800" , "--bind", "0.0.0.0:${ANALYSIS_PORT:-5000}", "app:app"]
    networks:
      - s3-network
  redis:
      image: redis:8.10-alpine
      restart: unless-stopped
      ports:
        - "${REDIS_PORT}:${REDIS_PORT}"
      command: > 
        redis-server
        --port 6379
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}

      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD} ping| grep PONG"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - ast-net
      volumes:
      - redis-data:/data


       
volumes:
  backend-data:
  analysis-data:
  minio-data:

networks:
  s3-network:
    driver: bridge