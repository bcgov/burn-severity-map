x-shared-env: &shared-env
  WORKER_LOG_DIR: ${WORKER_LOG_DIR}
  WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL}
  PARQUET_FILE: ${PARQUET_FILE}
  MAIN_DIR: ${MAIN_DIR}
  TEMP_DIR: ${TEMP_DIR}
  EXT_DIR: ${EXT_DIR}
  BACKEND_PORT: ${BACKEND_PORT:-8000}
  FRONTEND_PORT: ${FRONTEND_PORT:-8080}
  ANALYSIS_PORT: ${ANALYSIS_PORT:-5000}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_ACCESS_ID: ${S3_ACCESS_ID}
  S3_KEY: ${S3_KEY}
  S3_BUCKET: ${S3_BUCKET}
  NO_PROXY: ${NO_PROXY}
  AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
  AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
  APP_VERSION: 'dev-local'
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
  OIDC_AUTHORITY: ${OIDC_AUTHORITY}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/${REDIS_DATABASE:-0}
  JOB_QUEUE: ${JOB_QUEUE}

services:
  #objecstore for local devs
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: local-s3
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 API
    volumes:
      - seaweedfs-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - local-s3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/dir/status"]
      interval: 20s
      timeout: 5s
      retries: 10
  frontend:
    image: burn-sev-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-bs
    depends_on:
      - fastapi-backend
    ports:
      - "8080:${FRONTEND_PORT:-8080}"
    environment:
      <<: *shared-env
    env_file:
      - .env
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks:
      - local-s3

  fastapi-backend:
    image: burn-sev-backend:latest
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: fastapi-backend
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "8000:${BACKEND_PORT:-8000}"
    environment:
      <<: *shared-env
    env_file:
      - .env
    volumes:
      - backend-data:/app/data
    networks:
      - local-s3
    command: uv run python -m uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload

  analysis-worker:
    image: analysis-worker:latest
    build:
      context: ./analysis
      dockerfile: Dockerfile
    container_name: analysis-worker
    depends_on:
      seaweedfs:
        condition: service_healthy
      redis:
    environment:
      <<: *shared-env
    env_file:
      - .env
    volumes:
      - analysis-data:/app/data
    networks:
      - local-s3
  redis:
      image: redis:8.10-alpine
      restart: unless-stopped
      ports:
        - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
      command: > 
        redis-server
        --port ${REDIS_PORT:-6379}
        --save 60 1
        --appendonly no
        --requirepass ${REDIS_PASSWORD}

      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD} ping"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - local-s3
      volumes:
      - redis-data:/data
       
volumes:
  backend-data:
  analysis-data:
  seaweedfs-data:
  redis-data:

networks:
  local-s3:
    driver: bridge