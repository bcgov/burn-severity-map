apiVersion: v2
name: burn-severity-map
description: Umbrella helm chart for deploying the burn-severity-map application, supports publication of bs results.
icon: https://www.nicepng.com/png/detail/521-5211827_bc-icon-british-columbia-government-logo.png

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: frontend
    version: 0.1.0
    repository: "file://frontend"
  - name: backend
    version: 0.1.0
    repository: "file://backend"

maintainers:
  - name: Will Burt
    email: william.burt@gov.bc.ca
  - name: Isaac Cave
    email: Isaac.Cave@gov.bc.ca
  - name: Emma Armitage
    email: emma.armitage@gov.bc.ca