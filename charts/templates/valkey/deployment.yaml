{{- if .Values.valkey.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "burn-severity-map.fullname" . }}-valkey
  labels:
    app.kubernetes.io/component: valkey
    {{- include "burn-severity-map.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.valkey.deploymentStrategy }}
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
      {{- include "burn-severity-map.selectorLabels" . | nindent 4 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
        {{- include "burn-severity-map.selectorLabels" . | nindent 4 }}
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.registry }}/{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.global.valkey.port }}
              name: valkey
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          # No volumeMounts or PVCs needed—running entirely in-memory (ephemeral)
