{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  strategy:
    type: {{ .Values.backend.deploymentStrategy }}
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/api/metrics'
      labels:
        {{- include "backend.labels" . | nindent 8 }}
    spec:
      {{- if .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ include "backend.fullname" . }}
          {{- if .Values.backend.securityContext }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          {{- end }}
          image: "{{.Values.backend.image.registry}}/{{.Values.backend.image.repository}}:{{.Values.backend.image.tag}}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          envFrom:
            {{- if .Values.backend.configMap.enabled }}
            - configMapRef:
                name: {{ include "backend.fullname" . }}
            {{- end }}
          env:
              - name: FRONTEND_URL
                value: {{ printf "https://%s" .Values.frontend.domain | quote }}
              - name: BASE_LOGIN_URL
                value: {{ printf "https://%s.%s" .Values.frontend.appName .Values.frontend.domain | quote }}
            {{- range .Values.backend.env }}
              - name: {{ .name }}
              {{- if .value }}
                value: {{ quote .value }}
              {{- else if .valueFrom }}
                valueFrom:
{{ toYaml .valueFrom | indent 18 }}
              {{- end }}
            {{- end }}
            



          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          # readinessProbe:
          #   httpGet:
          #     path: /api/health
          #     port: http
          #     scheme: HTTP
          #   initialDelaySeconds: 5
          #   periodSeconds: 2
          #   timeoutSeconds: 2
          #   successThreshold: 1
          #   failureThreshold: 30
          # livenessProbe:
          #   successThreshold: 1
          #   failureThreshold: 3
          #   httpGet:
          #     path: /api/health
          #     port: 3000
          #     scheme: HTTP
          #   initialDelaySeconds: 15
          #   periodSeconds: 30
          #   timeoutSeconds: 5

          resources:
            {{- if .Values.backend.resources.requests }}
            requests:
          {{ toYaml .Values.backend.resources.requests | indent 12 }}
            {{- end }}
            {{- if .Values.backend.resources.limits }}
            limits:
          {{ toYaml .Values.backend.resources.limits | indent 12 }}
            {{- end }}

      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ include "backend.fullname" . }}
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"

{{- end }}