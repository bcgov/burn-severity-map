    type: ClusterIP
    # port: {{ .Values.global.ports.analysis }} # this is the service port, where it will be exposed internal to the namespace.
    # targetPort: {{ .Values.global.ports.analysis }} # this is container port where app listens on
  route:
    timeout: 300s
    # targetPort: {{ .Values.global.ports.analysis }} # match the service
  pdb:
    enabled: false # enable it in PRODUCTION for having pod disruption budget.
    minAvailable: 1 # the minimum number of pods that must be available during the disruption budget.